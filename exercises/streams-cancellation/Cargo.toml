[package]
name = "streams-cancellation"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The section is about what a runtime does with futures, so it needs a real
# one. tokio-stream carries the Stream trait and the adapter vocabulary; futures
# supplies the BoxStream alias and the poll-once helper the tests use to assert
# "still pending" without spending a millisecond on it.
[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
