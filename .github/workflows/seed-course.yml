name: seed-course

# Course content is the one thing a deploy does not ship. migrate-on-deploy.ts
# applies pending migrations during the API build, but nothing runs db:seed, so a
# release can ship a new course whose lessons do not exist yet. This is that step,
# run deliberately rather than on every push.
#
# Needs a POSTGRES_URL secret in the chosen environment. The seeder writes content
# tables only: progress, XP, badges, reviews and notes are never touched.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose POSTGRES_URL to seed"
        type: environment
        required: true

concurrency:
  group: seed-course-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed course content
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Seed
        run: bun run db:seed
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
